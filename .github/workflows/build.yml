name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7

    # Shared design system consumed by the frontend via
    # file:/home/lnb/Desktop/HA/ha-ui (public repo, same org). checkout must
    # stay inside the workspace, so it is copied to the absolute path after.
    - name: Check out @ha/ui
      uses: actions/checkout@v7
      with:
        repository: CoreMatch/ha-ui
        path: ha-ui

    - name: "Place @ha/ui at its file: dependency path"
      run: |
        sudo mkdir -p /home/lnb/Desktop/HA
        sudo cp -r ha-ui /home/lnb/Desktop/HA/ha-ui
        sudo chown -R "$USER" /home/lnb/Desktop/HA/ha-ui

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: |
        go mod tidy
        cd /home/lnb/Desktop/HA/ha-ui && npm install
        cd frontend && npm install
    
    - name: Build frontend
      run: cd frontend && npm run build
    
    - name: Run Go tests
      run: go test ./...
    
    - name: Type check frontend
      run: cd frontend && npm run typecheck
    
    - name: Lint frontend
      run: cd frontend && npm run lint
    
    - name: Install Linux build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
    
    - name: Build application
      run: |
        go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
        wails build
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: build-output
        path: build/bin/