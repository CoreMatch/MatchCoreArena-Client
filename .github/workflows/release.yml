name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v7

    # Shared design system consumed by the frontend via
    # file:/home/lnb/Desktop/HA/ha-ui (public repo, same org). The path is
    # absolute (matching the local development layout), so create it first.
    - name: Prepare @ha/ui path
      run: sudo mkdir -p /home/lnb/Desktop/HA && sudo chown -R "$USER" /home/lnb

    - name: Check out @ha/ui
      uses: actions/checkout@v7
      with:
        repository: CoreMatch/ha-ui
        path: /home/lnb/Desktop/HA/ha-ui

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: |
        go mod tidy
        cd /home/lnb/Desktop/HA/ha-ui && npm install
        cd frontend && npm install
    
    - name: Build frontend
      run: cd frontend && npm run build
    
    - name: Install Linux build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
    
    - name: Build application
      run: |
        go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
        wails build
    
    - name: Install Windows cross-compile toolchain
      run: sudo apt-get install -y gcc-mingw-w64-x86-64
    
    - name: Build Windows application
      run: wails build -platform windows/amd64
    
    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          build/bin/MatchCoreArenaClient
          build/bin/MatchCoreArenaClient.exe
        draft: false
        prerelease: false
        generate_release_notes: true